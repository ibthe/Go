name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Type-check macOS packet flow adapter
        if: runner.os == 'macOS'
        run: swiftc -typecheck platform/macos/PacketTunnel/PacketTunnelFlowAdapter.swift platform/macos/PacketTunnel/GoPacketEngineCABI.swift platform/macos/PacketTunnel/GoPacketTunnelProvider.swift platform/macos/PacketTunnel/ProxyCredentialStore.swift platform/macos/PacketTunnel/GoSharedConfiguration.swift
