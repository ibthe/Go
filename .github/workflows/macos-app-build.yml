name: macOS app build

on:
  push:
    branches: [main]
    paths:
      - "platform/macos/**"
      - "scripts/build-macos-go-library.sh"
      - "experiments/gvisor/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-app-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "platform/macos/**"
      - "scripts/build-macos-go-library.sh"
      - "experiments/gvisor/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-app-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: experiments/gvisor/go.mod
      - name: Build universal Go XCFramework
        run: bash scripts/build-macos-go-library.sh build/macos
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: platform/macos
        run: xcodegen generate
      - name: Build unsigned macOS app and packet tunnel extension
        working-directory: platform/macos
        run: xcodebuild -project Go.xcodeproj -scheme Go -configuration Debug -destination 'platform=macOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned macOS app
        working-directory: platform/macos
        run: |
          mkdir -p build/package
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Debug/Go.app build/package/Go-macOS-unsigned.zip
          cat > build/package/INSTALL.txt <<'EOF'
          Go for macOS — unsigned development build

          1. Unzip Go-macOS-unsigned.zip.
          2. Move Go.app to Applications.
          3. Control-click Go.app and choose Open. Confirm Open in the macOS dialog.
          4. This unsigned build is for opening the app shell only.

          IMPORTANT: The Packet Tunnel extension is not provisioned or signed.
          Connect is not a working system VPN yet. The provider installs no
          included traffic routes. Do not rely on this build for privacy or
          traffic protection.
          EOF
      - name: Upload unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: go-macos-download-package
          path: |
            platform/macos/build/package/Go-macOS-unsigned.zip
            platform/macos/build/package/INSTALL.txt
          if-no-files-found: error
          retention-days: 14
